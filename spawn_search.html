<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
<title>Torrent Search</title>
<style>
  body { font-family: system-ui, sans-serif; background: #121212; color: #eee; margin: 0; padding: 16px; }
  input, button { font-size: 1rem; padding: 12px; border-radius: 8px; border: none; }
  input { width: 70%; background: #1e1e1e; color: #fff; }
  button { background: #3a7bd5; color: #fff; margin-left: 8px; cursor: pointer; }
  .card { background: #1e1e1e; border-radius: 12px; padding: 14px; margin: 12px 0; box-shadow: 0 2px 8px rgba(0,0,0,0.5); }
  .title a { color: #fff; text-decoration: none; font-size: 1.1rem; font-weight: bold; }
  .title a:hover { text-decoration: underline; }
  .meta { font-size: 0.85rem; color: #aaa; margin: 8px 0; }
  .btn { 
    display: inline-block; 
    padding: 10px 18px; 
    border-radius: 6px; 
    font-weight: bold; 
    text-decoration: none; 
    color: #fff; 
    margin-right: 8px; 
    margin-top: 8px;
  }
  .link-btn { background: #2e7d32; }
  .link-btn:hover { background: #388e3c; }
  .guid-btn { background: #6a1b9a; }
  .guid-btn:hover { background: #7b1fa2; }
  .error { color: #ff6b6b; }
  .loading { color: #ffb74d; }
</style>
</head>
<body>
<h2>🔍 Поиск торрентов</h2>
<div style="display: flex; margin-bottom: 20px;">
  <input type="text" id="query" placeholder="Введите название..." autofocus>
  <button onclick="search()">Искать</button>
</div>
<div id="results"></div>

<script>
async function search() {
  const query = document.getElementById('query').value.trim();
  if (!query) return;
  const resDiv = document.getElementById('results');
  resDiv.innerHTML = '<div class="loading">Ищем...</div>';

  const apiUrl = `https://spawn.pp.ua:59117/api/v2.0/indexers/all/results?apikey=2&Query=${encodeURIComponent(query)}`;
  const proxyUrl = 'https://corsproxy.io/?' + encodeURIComponent(apiUrl);

  try {
    const resp = await fetch(apiUrl);
    if (!resp.ok) throw new Error(`Ошибка ${resp.status}`);
    const data = await resp.json();
    if (!data.Results || data.Results.length === 0) {
      resDiv.innerHTML = '<div class="error">Ничего не найдено</div>';
      return;
    }
    let html = '';
    data.Results.forEach(r => {
      const size = r.Size ? (r.Size / 1073741824).toFixed(2) + ' GB' : '?';
      const seeders = r.Seeders || 0;
      const tracker = r.Tracker || 'Неизвестный трекер';
      const title = r.Title || 'Без названия';
      const link = r.Link || '#';
      const guid = r.Guid || '#';
      const details = r.Details || '#';

      html += `
        <div class="card">
          <div class="title">
            <a href="${details}" target="_blank" rel="noopener">${title}</a>
          </div>
          <div class="meta">📡 ${tracker}  •  📦 ${size}  •  🔼 ${seeders} сидов</div>
          <a class="btn link-btn" href="${link}" target="_blank" rel="noopener">⬇ Скачать</a>
          <a class="btn guid-btn" href="${guid}" target="_blank" rel="noopener">🔗 На трекере</a>
        </div>
      `;
    });
    resDiv.innerHTML = html;
  } catch (err) {
    resDiv.innerHTML = `<div class="error">Ошибка: ${err.message}</div>`;
  }
}

// Поиск по Enter
document.getElementById('query').addEventListener('keypress', (e) => {
  if (e.key === 'Enter') search();
});
</script>
</body>
</html>
